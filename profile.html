<style>
  :root {
    --bg: #000; --ink: #84898e; --hi: #fff; --red: #f00007;
    --gold: rgba(168,145,65,.3);

    --fs: clamp(26px, 7.7vw, 64px);
    --rule: clamp(3px, .8vw, 4px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--mono); font-weight: 500;
    font-size: var(--fs); line-height: .97; letter-spacing: -.03em;
    text-transform: uppercase;
    min-height: 100svh;
    padding: calc(10px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  main { max-width: 1100px; }

  section { border-left: var(--rule) solid var(--gold); padding: 6px 12px 6px 10px; margin: 0 16px 0 6px; }
  section + section { margin-top: 14px; }
  .row { display: flex; align-items: flex-start; white-space: nowrap; }
  .row .no { flex-shrink: 0; width: 4ch; font-size: clamp(11px, 4vw, 20px); line-height: 1; letter-spacing: 0; padding-top: .25em; }
  .row .txt { flex-grow: 1; overflow: hidden; }
  a.row:hover, a.row:focus-visible { color: var(--hi); outline: none; }
  a.row:hover .txt::after { content: "↗"; }
  .hi { color: var(--hi); }
  .red { color: var(--red); }
  .gap { margin-top: .35em; }

  /* ---- map ---- */
  .map { border-left: 0; position: relative; padding: 0; margin: 10px 16px 0; }
  .map::before {
    content: ""; position: absolute; left: -10px; top: 0; bottom: 0; width: var(--rule);
    background: linear-gradient(180deg, var(--red) 0, var(--bg));
  }
  svg { display: block; width: 100%; height: auto; max-height: 72svh; }
  .land { fill: #141414; stroke: var(--ink); stroke-width: 1.2; stroke-linejoin: round; opacity: 0; transition: opacity .9s; }
  .borders { fill: none; stroke: #3a3a3a; stroke-width: .7; opacity: 0; transition: opacity .6s .4s; }
  .aichi { fill: var(--ink); opacity: 0; transition: opacity .5s; }
  .on .land, .on .borders { opacity: 1; }
  .route { fill: none; stroke: var(--red); stroke-width: 2.2; stroke-linecap: round; }
  .route.trail { stroke: var(--hi); stroke-width: 1; stroke-dasharray: 3 5; opacity: .5; }
  .label { font-family: var(--mono); fill: var(--hi); font-size: 44px; letter-spacing: -.02em; opacity: 0; transition: opacity .35s; }
  .label.sub { fill: var(--ink); font-size: 26px; }
  .label.show { opacity: 1; }
  .ring { fill: none; stroke: var(--red); stroke-width: 3; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .ring.go { animation: ring 1.6s ease-out infinite; }
  @keyframes ring { 0% { opacity: .9; transform: scale(.3); } 100% { opacity: 0; transform: scale(2.6); } }
  .pinbody { transition: fill .6s; }
</style>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const svg = $("map");
  const A = [612, 526.5], B = [698.1, 485.9];
  const FULL = [0, 0, 1000, 1000];
  // ズーム先：豊橋〜東京が画面の主役になる範囲
  const cx = (A[0] + B[0]) / 2, cy = (A[1] + B[1]) / 2, S = 300;
  const ZOOM = [cx - S / 2, cy - S / 2, S, S];

  const ease = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  const back = (t) => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  const clamp = (t) => Math.max(0, Math.min(1, t));
  const seg = (t, a, b) => clamp((t - a) / (b - a));

  const route = $("route"), trail = $("trail"), dot = $("dot");
  const len = route.getTotalLength();
  route.setAttribute("stroke-dasharray", `${len} ${len}`);

  function setView(v) {
    svg.setAttribute("viewBox", v.join(" "));
    const k = (v[2] / 1000) * 1.5; // ピンや文字の見た目の大きさを一定に保つ
    $("mkA").setAttribute("transform", `scale(${k})`);
    $("mkB").setAttribute("transform", `scale(${k})`);
    dot.setAttribute("r", 5 * k);
    return k;
  }
  function drop(el, p) { // p: 0→1
    el.setAttribute("opacity", p > 0 ? 1 : 0);
    el.setAttribute("transform", `translate(0 ${-(1 - back(p)) * 260})`);
  }

  function render(t) {
    // 0.0  地図
    // 0.9  豊橋にピン
    // 1.7  ズーム
    // 3.0  豊橋 → 東京へ線を引く
    // 4.5  東京にピン
    const z = ease(seg(t, 1.7, 2.9));
    const k = setView(FULL.map((v, i) => v + (ZOOM[i] - v) * z));

    drop($("pinA"), seg(t, .9, 1.45));
    $("aichi").style.opacity = t > 1.3 ? .3 : 0;
    $("labA").classList.toggle("show", t > 2.7);
    $("subA").classList.toggle("show", t > 2.8);

    const r = ease(seg(t, 3.0, 4.4));
    route.setAttribute("stroke-dashoffset", len * (1 - r));
    route.setAttribute("opacity", r > 0 ? 1 : 0);
    if (r > 0 && r < 1) {
      const p = route.getPointAtLength(len * r);
      dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y); dot.setAttribute("opacity", 1);
    } else dot.setAttribute("opacity", 0);
    $("pinAbody").setAttribute("fill", t > 4.4 ? "#84898e" : "#f00007"); // 過去の場所はグレーに

    drop($("pinB"), seg(t, 4.4, 4.95));
    $("labB").classList.toggle("show", t > 4.8);
    $("subB").classList.toggle("show", t > 4.9);
    if (t > 5 && !$("ringB").classList.contains("go")) $("ringB").classList.add("go");
  }

  requestAnimationFrame(() => svg.classList.add("on"));
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { render(99); return; }
  const t0 = performance.now();
  (function loop(now) {
    const t = (now - t0) / 1000;
    render(t);
    if (t < 5.2) requestAnimationFrame(loop);
  })(t0);
})();
</script>
