<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RYOTO TAKEUCHI</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="竹内 稜人 / Ryoto Takeuchi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #84898e;     /* 通常テキスト（グレー） */
    --hi: #fff;         /* ホバー */
    --gold: rgba(168,145,65,.3);
    --red: #f00007;
    --yellow: #ffc700;
    --blue: #40aaff;
    --mono: "JetBrains Mono", "Noto Sans JP", ui-monospace, Menlo, monospace;
    /* スマホ基準の大きめ可変サイズ */
    --fs: clamp(26px, 7.7vw, 64px);
    --lh: .97;
    --rule: clamp(3px, .8vw, 4px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
    font-size: var(--fs);
    line-height: var(--lh);
    letter-spacing: -.03em;
    text-transform: uppercase;
    min-height: 100svh;
    padding: calc(10px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; text-align: left; }
  main { max-width: 1100px; position: relative; z-index: 1; text-shadow: 0 0 2px #000, 0 0 10px #000; }

  /* ---- 背景：文字の雨 ---- */
  #rain {
    position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0;
    pointer-events: none; transition: opacity 1.6s ease;
  }
  #rain.dim { opacity: .42; }

  section {
    border-left: var(--rule) solid var(--gold);
    padding: 6px 12px 6px 10px;
    margin: 0 16px 0 6px;
  }
  section + section { margin-top: 14px; }

  /* ---- rows ---- */
  .row {
    display: flex; align-items: flex-start; gap: 0;
    width: 100%;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: color .08s;
  }
  .row .no {
    flex-shrink: 0; width: 4ch;
    font-size: clamp(11px, 4vw, 20px); line-height: 1;
    letter-spacing: 0; padding-top: .25em;
  }
  .row .txt { flex-grow: 1; overflow: hidden; text-overflow: clip; }
  .jp { font-family: "Noto Sans JP", sans-serif; font-weight: 700; letter-spacing: 0; }
  .row.act:hover, .row.act:focus-visible, .row.act:active { color: var(--hi); outline: none; }
  .row.act:hover .txt::after, .row.act:focus-visible .txt::after { content: "↗"; }
  .row.copy:hover .txt::after { content: "⧉"; }

  .sub { color: inherit; opacity: .55; }

  /* ---- 次の誕生日 / リンク ---- */
  section.next {
    border-left: 0; position: relative; cursor: default;
  }
  section.next::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--rule);
    background: linear-gradient(180deg, var(--red) 0, var(--bg));
  }
  .next .row { color: var(--red); }
  .links { color: var(--yellow); white-space: normal; padding-left: 4ch; }
  .links a, .links button { display: inline; }
  .links a:hover, .links button:hover { color: var(--hi); }
  .sep { opacity: .6; }

  section.clock { border-color: var(--blue); color: var(--blue); }

  .tab { font-variant-numeric: tabular-nums; }

  /* ---- toast ---- */
  .toast {
    z-index: 2;
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    background: var(--yellow); color: #000;
    font-size: clamp(14px, 4.5vw, 22px); padding: 10px 12px;
    transform: translateY(160%); transition: transform .18s steps(4);
    pointer-events: none;
  }
  .toast.on { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<main>
  <section>
    <a class="row act" href="profile.html"><span class="no">001</span><span class="txt" id="nameEn"></span></a>
    <button class="row act copy" id="nameJpRow"><span class="no">002</span><span class="txt jp" id="nameJp"></span></button>
    <div class="row"><span class="no">003</span><span class="txt">IT Engineer</span></div>
    <div class="row"><span class="no"></span><span class="txt">&amp; Consultant</span></div>
    <button class="row act copy" id="bdayRow"><span class="no">004</span><span class="txt">Born <span id="bday"></span></span></button>
    <div class="row"><span class="no">005</span><span class="txt">Age <span id="age"></span></span></div>
    <a class="row act" id="lineRow" target="_blank" rel="noopener"><span class="no">006</span><span class="txt">LINE: Add friend</span></a>
    <a class="row act" href="request.html"><span class="no">007</span><span class="txt">Request</span></a>
  </section>

  <section class="next">
    <div class="row"><span class="no">TBD</span><span class="txt">Next b-day</span></div>
    <div class="row"><span class="no"></span><span class="txt tab" id="countdown">--D --:--:--</span></div>
    <p class="links">
      <button id="share">Share↗</button>
      <span class="sep">///</span>
      <button id="copyUrl">Copy URL</button>
    </p>
  </section>


  <section class="clock">
    <div class="row"><span class="no">TYO</span><span class="txt tab" id="clock">--:--:--</span></div>
  </section>
</main>

<div class="toast" id="toast">Copied</div>

<script>
/* ==================================================================
   PROFILE — ここだけ書き換えればOK
   ================================================================== */
const PROFILE = {
  nameEn:   "Ryoto Takeuchi",
  nameJp:   "竹内 稜人",
  birthday: "1998-09-06",                      // YYYY-MM-DD
  lineUrl:  "https://line.me/ti/p/9pq_8edbGT", // LINEアプリ「自分のQRコード → リンクをコピー」で取得したURL
};
/* ================================================================== */

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");

const [by, bm, bd] = PROFILE.birthday.split("-").map(Number);
const bdayText = `${by}.${pad(bm)}.${pad(bd)}`;

function tokyoNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));
}
function ageAt(t) {
  let a = t.getFullYear() - by;
  if (t < new Date(t.getFullYear(), bm - 1, bd)) a--;
  return a;
}

$("nameEn").textContent = PROFILE.nameEn;
$("nameJp").textContent = PROFILE.nameJp;
$("bday").textContent = bdayText;
$("age").textContent = ageAt(tokyoNow());
$("lineRow").href = PROFILE.lineUrl;

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1400);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied: " + text); }
  catch { toast(text); }
}
$("nameJpRow").addEventListener("click", () => copy(PROFILE.nameJp));
$("bdayRow").addEventListener("click", () => copy(bdayText));
$("copyUrl").addEventListener("click", () => copy(location.href));
$("share").addEventListener("click", async () => {
  const data = { title: PROFILE.nameEn, text: `${PROFILE.nameJp} / ${PROFILE.nameEn}`, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch {} }
  else copy(location.href);
});

function tick() {
  const t = tokyoNow();
  $("clock").textContent = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;

  let next = new Date(t.getFullYear(), bm - 1, bd);
  if (t >= next) next = new Date(t.getFullYear() + 1, bm - 1, bd);
  const s = Math.floor((next - t) / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
  $("countdown").textContent = `${d}D ${pad(h)}:${pad(m)}:${pad(s % 60)}`;
}
tick(); setInterval(tick, 1000);

/* ==================================================================
   背景：名前が崩れて、サイトにまつわる文字が降る
   ================================================================== */
(function rain() {
  const cv = $("rain"), ctx = cv.getContext("2d");
  const FONT = '"JetBrains Mono", "Noto Sans JP", ui-monospace, monospace';
  const GREEN = "#00ff41", HEAD = "#e6ffe9";

  // ---- 降らせる文字列（このサイトの情報をエンコード・翻訳したもの） ----
  const enc = new TextEncoder();
  const bytes = (s) => [...enc.encode(s)];
  const bin = (s) => bytes(s).map((b) => b.toString(2).padStart(8, "0")).join(" ");
  const hex = (s) => bytes(s).map((b) => b.toString(16).toUpperCase().padStart(2, "0")).join(" ");
  const b64 = (s) => btoa(String.fromCharCode(...bytes(s)));
  const MORSE = { R: ".-.", Y: "-.--", O: "---", T: "-", A: ".-", K: "-.-", E: ".", U: "..-", C: "-.-.", H: "....", I: ".." };
  const morse = (s) => [...s].map((c) => MORSE[c] || "/").join(" ");
  const [N1, N2] = PROFILE.nameEn.toUpperCase().split(" ");
  const jp = PROFILE.nameJp.replace(/\s/g, "");
  const ymd = PROFILE.birthday.replace(/-/g, "");
  const TOKENS = [
    bin(N1), hex(N2), b64(N1 + " " + N2), morse(N1),
    hex(jp), encodeURIComponent(jp), "竹内稜人", "リョウト タケウチ",
    "타케우치 료토", "Рёто Такэути", "Ριότο Τακεούτσι",
    ymd, "0x" + Number(ymd).toString(16).toUpperCase(), bin(String(by)),
    "トヨハシ アイチ", "豊橋", "34.7692N 137.3915E", hex("TOYOHASHI"),
    "IT ENGINEER", "CONSULTANT", bin("IT"), b64("CONSULTANT"),
    "RYOTO109", "ryoto109.github.io",
    "スシ マグロ イクラ タマゴ エビ", // マトリックスの文字は寿司レシピのカタカナが元ネタ
  ];
  const GLITCH = "01ABCDEF0x%=/リョウトタケウチ竹内稜人";
  const pick = (a) => a[(Math.random() * a.length) | 0];
  const KANA = /[゠-ヿ]/;

  function draw(ch, x, y, size) {
    if (KANA.test(ch)) { // カタカナは鏡文字に
      ctx.save(); ctx.translate(x + size * .8, y); ctx.scale(-1, 1); ctx.fillText(ch, 0, 0); ctx.restore();
    } else ctx.fillText(ch, x, y);
  }

  let W, H, fs, ps, cols, drops, parts = [], t0, last, dimTimer;

  function newDrop(d, top) {
    d.tok = pick(TOKENS) + "   ";
    d.i = 0;
    d.y = top ? -Math.random() * 12 : d.y;
    d.v = 7 + Math.random() * 13; // セル/秒
    d.cell = null; d.prev = null;
  }

  // 名前を小さいセルのグリッドに描いて、点（粒子）に分解する
  function shatter() {
    const pc = Math.ceil(W / ps), pr = Math.ceil(H / ps);
    const oc = document.createElement("canvas"); oc.width = pc; oc.height = pr;
    const o = oc.getContext("2d");
    o.font = `900 100px "Arial Black", Impact, sans-serif`;
    const wMax = Math.max(o.measureText(N1).width, o.measureText(N2).width);
    // 内容の下に空きがあればそこへ、なければ画面中央へ
    const below = document.querySelector("main").getBoundingClientRect().bottom;
    const free = H - below;
    const cy = (free > H * .28 ? (below + H) / 2 : H * .5) / ps;
    const size = Math.min((pc * .9) / wMax * 100, pr * .2, free > H * .28 ? (free / ps) * .42 : Infinity);
    o.font = `900 ${size}px "Arial Black", Impact, sans-serif`;
    o.textAlign = "center"; o.textBaseline = "middle"; o.fillStyle = "#fff";
    o.fillText(N1, pc / 2, cy - size * .52);
    o.fillText(N2, pc / 2, cy + size * .52);
    const img = o.getImageData(0, 0, pc, pr).data;
    const src = (N1 + N2).split("");
    parts = [];
    let maxR = 0, minR = pr;
    for (let r = 0; r < pr; r++) for (let c = 0; c < pc; c++) {
      if (img[(r * pc + c) * 4 + 3] > 120) { parts.push({ x: c * ps, y: r * ps, r, vy: 0, ch: pick(src) }); maxR = Math.max(maxR, r); minR = Math.min(minR, r); }
    }
    // 下の方から崩れていく
    parts.forEach((p) => { p.delay = .7 + (1 - (p.r - minR) / Math.max(1, maxR - minR)) * .9 + Math.random() * .7; });
  }

  function setup(intro) {
    const dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textBaseline = "top";
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    fs = Math.max(14, Math.min(20, W / 26));
    ps = Math.max(5, W / 70);
    cols = Math.ceil(W / fs);
    drops = Array.from({ length: cols }, () => {
      const d = { on: false, start: (intro ? 1.2 : 0) + Math.random() * 3 }; newDrop(d, true); return d;
    });
    t0 = last = performance.now();
    clearTimeout(dimTimer);
    if (intro) { cv.classList.remove("dim"); shatter(); dimTimer = setTimeout(() => cv.classList.add("dim"), 2600); }
    else { parts = []; cv.classList.add("dim"); }
  }

  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000), t = (now - t0) / 1000;
    last = now;
    ctx.fillStyle = "rgba(0,0,0,.09)"; ctx.fillRect(0, 0, W, H);

    // 名前の粒子
    if (parts.length) {
      ctx.font = `700 ${ps * 1.05}px ${FONT}`;
      for (const p of parts) {
        if (t < p.delay) {
          if (Math.random() < .03) p.ch = pick(GLITCH);
          ctx.fillStyle = t < .25 ? "#fff" : HEAD;
        } else {
          p.vy += 1100 * dt;
          const before = Math.floor(p.y / ps);
          p.y += p.vy * dt;
          if (Math.floor(p.y / ps) !== before) p.ch = pick(GLITCH);
          ctx.fillStyle = GREEN;
          if (p.y > H) { p.dead = true; const d = drops[Math.floor(p.x / fs)]; if (d && !d.on) { d.on = true; d.start = 0; } }
        }
        draw(p.ch, p.x, p.y, ps);
      }
      parts = parts.filter((p) => !p.dead);
    }

    // 文字の雨
    ctx.font = `500 ${fs}px ${FONT}`;
    for (let c = 0; c < cols; c++) {
      const d = drops[c];
      if (!d.on && t < d.start) continue;
      d.on = true;
      d.y += d.v * dt;
      const cell = Math.floor(d.y);
      if (cell !== d.cell) {
        const x = c * fs;
        if (d.prev !== null && d.cell >= 0) { // 1つ前の先頭を緑に塗り直す
          ctx.fillStyle = "#000"; ctx.fillRect(x, d.cell * fs, fs, fs);
          ctx.fillStyle = GREEN; draw(d.prev, x, d.cell * fs, fs);
        }
        d.cell = cell;
        d.prev = d.tok[d.i++ % d.tok.length];
        if (cell >= 0) { ctx.fillStyle = HEAD; draw(d.prev, x, cell * fs, fs); }
        if (cell * fs > H) { newDrop(d, false); d.y = -Math.random() * 25; }
      }
    }
    requestAnimationFrame(frame);
  }

  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    // 動きを減らす設定：静止した文字を薄く敷くだけ
    setup(false);
    ctx.font = `500 ${fs}px ${FONT}`; ctx.fillStyle = GREEN;
    for (let c = 0; c < cols; c++) {
      const tok = pick(TOKENS), y0 = (Math.random() * H / fs) | 0;
      for (let i = 0; i < tok.length && (y0 + i) * fs < H; i++) draw(tok[i], c * fs, (y0 + i) * fs, fs);
    }
    return;
  }

  let rw = innerWidth;
  addEventListener("resize", () => { if (innerWidth !== rw) { rw = innerWidth; setup(false); } }); // スマホのアドレスバー伸縮では作り直さない
  const begin = () => { setup(true); requestAnimationFrame(frame); };
  document.fonts && document.fonts.ready ? document.fonts.ready.then(begin) : begin();
})();
</script>
</body>
</html>
