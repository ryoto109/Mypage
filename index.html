<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RYOTO TAKEUCHI</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="description" content="竹内 稜人 / Ryoto Takeuchi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #84898e;     /* 通常テキスト（グレー） */
    --hi: #fff;         /* ホバー */
    --gold: rgba(168,145,65,.3);
    --red: #f00007;
    --yellow: #ffc700;
    --blue: #40aaff;
    --mono: "JetBrains Mono", "Noto Sans JP", ui-monospace, Menlo, monospace;
    /* スマホ基準の大きめ可変サイズ */
    --fs: clamp(26px, 7.7vw, 64px);
    --lh: .97;
    --rule: clamp(3px, .8vw, 4px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    font-weight: 500;
    font-size: var(--fs);
    line-height: var(--lh);
    letter-spacing: -.03em;
    text-transform: uppercase;
    min-height: 100svh;
    padding: calc(10px + env(safe-area-inset-top)) 0 calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-transform: inherit; letter-spacing: inherit; text-align: left; }
  main { max-width: 1100px; }


  section {
    border-left: var(--rule) solid var(--gold);
    padding: 6px 12px 6px 10px;
    margin: 0 16px 0 6px;
  }
  section + section { margin-top: 14px; }

  /* ---- rows ---- */
  .row {
    display: flex; align-items: flex-start; gap: 0;
    width: 100%;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: color .08s;
  }
  .row .no {
    flex-shrink: 0; width: 4ch;
    font-size: clamp(11px, 4vw, 20px); line-height: 1;
    letter-spacing: 0; padding-top: .25em;
  }
  .row .txt { flex-grow: 1; overflow: hidden; text-overflow: clip; }
  .jp { font-family: "Noto Sans JP", sans-serif; font-weight: 700; letter-spacing: 0; }
  .row.act:hover, .row.act:focus-visible, .row.act:active { color: var(--hi); outline: none; }
  .row.act:hover .txt::after, .row.act:focus-visible .txt::after { content: "↗"; }
  .row.copy:hover .txt::after { content: "⧉"; }

  .sub { color: inherit; opacity: .55; }

  /* ---- 次の誕生日 / リンク ---- */
  section.next {
    border-left: 0; position: relative; cursor: default;
  }
  section.next::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--rule);
    background: linear-gradient(180deg, var(--red) 0, var(--bg));
  }
  .next .row { color: var(--red); }
  .links { color: var(--yellow); white-space: normal; padding-left: 4ch; }
  .links a, .links button { display: inline; }
  .links a:hover, .links button:hover { color: var(--hi); }
  .sep { opacity: .6; }

  /* ---- 友達ステータス（NFCで来た人） ---- */
  .friend { color: #00ff41; text-shadow: 0 0 8px rgba(0,255,65,.5); }

  /* ---- 秘密 ---- */
  section.secret { border-left-style: dashed; border-color: #444; color: #5d6166; }
  .secret .head { color: #3a3d40; }
  .lock .txt::after { content: " ▒"; color: var(--red); opacity: .8; }
  .row.lock:hover .txt::after, .row.lock:focus-visible .txt::after { content: " ▒"; }
  .redact { background: currentColor; }

  section.clock { border-color: var(--blue); color: var(--blue); }

  .tab { font-variant-numeric: tabular-nums; }

  /* ---- toast ---- */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    background: var(--yellow); color: #000;
    font-size: clamp(14px, 4.5vw, 22px); padding: 10px 12px;
    transform: translateY(160%); transition: transform .18s steps(4);
    pointer-events: none;
  }
  .toast.on { transform: translateY(0); }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
<link rel="stylesheet" href="retro.css">
</head>
<body>
<main>
  <section>
    <a class="row act" href="profile.html"><span class="no">001</span><span class="txt" id="nameEn"></span></a>
    <button class="row act copy" id="nameJpRow"><span class="no">002</span><span class="txt jp" id="nameJp"></span></button>
    <button class="row act copy" id="bdayRow"><span class="no">003</span><span class="txt">Born <span id="bday"></span></span></button>
    <button class="row act" id="ageRow"><span class="no">004</span><span class="txt">Age <span id="age"></span></span></button>
    <a class="row act" id="lineRow" target="_blank" rel="noopener"><span class="no">005</span><span class="txt">LINE: Add friend</span></a>
    <a class="row act" href="request.html"><span class="no">006</span><span class="txt">Request</span></a>
    <div class="row friend" id="friendRow" hidden><span class="no">YOU</span><span class="txt">Friend ✓</span></div>
  </section>

  <section class="secret">
    <div class="row head"><span class="no">///</span><span class="txt">Classified</span></div>
    <button class="row act lock" data-secret="love"><span class="no">007</span><span class="txt">Love History</span></button>
    <button class="row act lock" data-secret="ex"><span class="no">008</span><span class="txt">EX.ZIP</span></button>
    <button class="row act lock" data-secret="search"><span class="no">009</span><span class="txt">Search History</span></button>
    <button class="row act lock" data-secret="txt"><span class="no">010</span><span class="txt">Secrets.txt</span></button>
    <button class="row act lock" data-secret="bank"><span class="no">011</span><span class="txt">Bank Balance</span></button>
  </section>

  <section class="next">
    <div class="row"><span class="no">TBD</span><span class="txt">Next b-day</span></div>
    <div class="row"><span class="no"></span><span class="txt tab" id="countdown">--D --:--:--</span></div>
    <p class="links">
      <button id="share">Share↗</button>
      <span class="sep">///</span>
      <button id="copyUrl">Copy URL</button>
    </p>
  </section>


  <section class="clock">
    <div class="row"><span class="no">TYO</span><span class="txt tab" id="clock">--:--:--</span></div>
  </section>
</main>

<div class="toast" id="toast">Copied</div>

<script src="retro.js"></script>
<script>
/* ==================================================================
   PROFILE — ここだけ書き換えればOK
   ================================================================== */
const PROFILE = {
  nameEn:   "Ryoto Takeuchi",
  nameJp:   "竹内 稜人",
  birthday: "1998-09-06",                      // YYYY-MM-DD
  lineUrl:  "https://line.me/ti/p/9pq_8edbGT", // LINEアプリ「自分のQRコード → リンクをコピー」で取得したURL
};
/* ================================================================== */

const $ = (id) => document.getElementById(id);
const pad = (n) => String(n).padStart(2, "0");

const [by, bm, bd] = PROFILE.birthday.split("-").map(Number);
const bdayText = `${by}.${pad(bm)}.${pad(bd)}`;

function tokyoNow() {
  return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Tokyo" }));
}
function ageAt(t) {
  let a = t.getFullYear() - by;
  if (t < new Date(t.getFullYear(), bm - 1, bd)) a--;
  return a;
}

$("nameEn").textContent = PROFILE.nameEn;
$("nameJp").textContent = PROFILE.nameJp;
$("bday").textContent = bdayText;
$("age").textContent = ageAt(tokyoNow());
$("lineRow").href = PROFILE.lineUrl;

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 1400);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied: " + text); }
  catch { toast(text); }
}
$("nameJpRow").addEventListener("click", () => copy(PROFILE.nameJp));
$("bdayRow").addEventListener("click", () => copy(bdayText));
$("copyUrl").addEventListener("click", () => copy(location.href));
$("share").addEventListener("click", async () => {
  const data = { title: PROFILE.nameEn, text: `${PROFILE.nameJp} / ${PROFILE.nameEn}`, url: location.href };
  if (navigator.share) { try { await navigator.share(data); } catch {} }
  else copy(location.href);
});

function tick() {
  const t = tokyoNow();
  $("clock").textContent = `${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;

  let next = new Date(t.getFullYear(), bm - 1, bd);
  if (t >= next) next = new Date(t.getFullYear() + 1, bm - 1, bd);
  const s = Math.floor((next - t) / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s / 3600) % 24, m = Math.floor(s / 60) % 60;
  $("countdown").textContent = `${d}D ${pad(h)}:${pad(m)}:${pad(s % 60)}`;
}
tick(); setInterval(tick, 1000);

/* ==================================================================
   NFCで来た人だけ：友達認定（チップには ...?nfc のURLを書き込む）
   ================================================================== */
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const FRIEND_KEY = "ryoto-friend";
function getFriend() { try { return JSON.parse(localStorage.getItem(FRIEND_KEY)); } catch { return null; } }
function showFriend() { if (getFriend()) $("friendRow").hidden = false; }
showFriend();

async function nfcWelcome() {
  const lines = [
    "> NFC CHIP DETECTED (13.56 MHz)",
    "> READING NTAG I2C PLUS ......... OK",
    "> HANDSHAKE WITH RYOTO.TAKEUCHI . OK",
    "> SCANNING YOUR VIBE ............ OK",
    "> VERIFYING FRIENDSHIP ...",
    "> ACCESS GRANTED_",
  ];
  const term = retro.screen("term", '<div id="termOut"></div>');
  const out = $("termOut");
  const s = document.querySelector(".w98-screen.term");
  const skipped = () => !document.body.contains(s); // タップ・キーで飛ばせる
  for (const line of lines) {
    const p = document.createElement("div"); out.appendChild(p);
    for (const ch of line) { if (skipped()) break; p.textContent += ch; await wait(12); }
    p.textContent = line;
    if (!skipped()) await wait(180);
  }
  if (!skipped()) { await wait(450); s.click(); }
  await term;

  let f = getFriend();
  if (!f) {
    const t = tokyoNow();
    f = { id: String(Math.floor(Math.random() * 9000) + 1000), since: `${t.getFullYear()}.${pad(t.getMonth() + 1)}.${pad(t.getDate())}` };
    try { localStorage.setItem(FRIEND_KEY, JSON.stringify(f)); } catch {}
  }
  showFriend();
  const a = await retro.dialog({
    title: "Friend Request Accepted",
    icon: "info",
    message: `Congratulations!\nYou have been recognized as a FRIEND by Ryoto Takeuchi.\n竹内稜人に友達として認められました。おめでとう！\nFriend ID: #${f.id} / Since ${f.since}`,
    buttons: ["Add on LINE", "OK"],
  });
  if (a === "Add on LINE") window.open(PROFILE.lineUrl, "_blank", "noopener");
}
if (new URLSearchParams(location.search).has("nfc")) {
  history.replaceState(null, "", location.pathname); // 再読み込みやURL共有では出ないように
  setTimeout(nfcWelcome, 700);
}

/* ==================================================================
   CLASSIFIED：秘密の項目
   ================================================================== */
let loveTries = 0;
const SECRETS = {
  // 恋愛遍歴：パスワード画面 → 3回まちがえるとブルースクリーン
  async love() {
    const pw = await retro.dialog({
      title: "Enter Network Password", icon: "key",
      message: "LOVE_HISTORY.DB is password protected.\nPlease enter your password.",
      input: { label: "Password:", type: "password" }, buttons: ["OK", "Cancel"],
    });
    if (pw === null) return;
    if (pw === "19980906") { // 隠し正解：誕生日
      await retro.dialog({ title: "LOVE_HISTORY.DB", icon: "info", message: "Password accepted.\nLOVE_HISTORY.DB — 0 bytes.\n…それは秘密です。" });
      return;
    }
    loveTries++;
    if (loveTries < 3) {
      await retro.dialog({ title: "Error", icon: "error", message: `The password is incorrect. (${loveTries}/3)\nThis attempt has been reported to Ryoto.` });
      return SECRETS.love();
    }
    loveTries = 0;
    await retro.screen("bsod", `<div class="box">
      <div class="head">LOVE.SYS</div>
      <p>A fatal exception 0E has occurred at 0028:C0FFEE36 in VXD HEART(01) + 00010E36. The current relationship will be terminated.</p>
      <p>* Too many incorrect passwords.<br>* Press any key to stop asking about my love life.</p>
      <p class="cont">Press any key to continue <span class="cur">_</span></p></div>`);
  },
  // 元カノフォルダ：Not Found
  ex: () => retro.screen("apache", `<h1>Not Found</h1>
    <p>The requested URL /ex.zip was not found on this server.</p>
    <p>It was deleted a long time ago. Please move on.</p>
    <p>Additionally, a 404 Not Found error was encountered while trying to use an ErrorDocument to handle the request.</p>
    <hr><address>Apache/1.3.6 (Unix) Server at ryoto109.github.io Port 80</address>
    <p style="margin-top:24px;color:#888;font-size:13px">(tap anywhere to go back)</p>`),
  // 検索履歴：Forbidden
  search: () => retro.screen("apache", `<h1>Forbidden</h1>
    <p>You don't have permission to access /search-history on this server.</p>
    <p>Nobody does. Not even me.</p>
    <hr><address>Apache/1.3.6 (Unix) Server at ryoto109.github.io Port 80</address>
    <p style="margin-top:24px;color:#888;font-size:13px">(tap anywhere to go back)</p>`),
  // 秘密のメモ：黒塗りのメモ帳
  txt: () => {
    const r = (n) => `<span class="rd">${"x".repeat(n)}</span>`;
    return retro.screen("win", `<div class="w98 w98-note">
      <div class="w98-title"><span>SECRETS.TXT - Notepad</span><button class="w98-x" aria-label="Close">✕</button></div>
      <div class="menu"><span><u>F</u>ile</span><span><u>E</u>dit</span><span><u>S</u>earch</span><span><u>H</u>elp</span></div>
      <div class="paper">1. I actually ${r(6)} ${r(9)}.
2. My real ${r(5)} is ${r(7)}.
3. ${r(4)} ${r(11)} since 2009.
4. Never tell ${r(8)} about the ${r(6)}.
5. ${r(18)}

[REDACTED BY RYOTO.EXE]</div></div>`);
  },
  // 残高：お金
  bank: () => retro.dialog({
    title: "Online Banking", icon: "error",
    message: "Insufficient funds to display balance.\nError code: お金 0x00000000",
  }),
};
document.querySelectorAll("[data-secret]").forEach((b) => b.addEventListener("click", () => SECRETS[b.dataset.secret]()));

/* ---- 年齢をタップ：Win98風ダイアログ ---- */
$("ageRow").addEventListener("click", async () => {
  const a = await retro.dialog({
    title: "System Properties",
    message: `Age ${ageAt(tokyoNow())} is read-only.\nDo you want to roll back to ${bdayText}?`,
    buttons: ["Yes", "No"],
  });
  if (a === "Yes") await retro.dialog({ title: "Error", message: "Access is denied.\nTime only moves forward.", buttons: ["OK"] });
});


</script>
</body>
</html>
